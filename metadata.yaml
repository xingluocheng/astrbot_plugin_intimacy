name: astrbot_plugin_intimacy
display_name: 大肥鱼的亲密度
short_desc: 按聊天天数推进关系：生人 → 眼熟 → 亲密，主人恒定最高
desc: |-
  让她记得「和这个人聊了多久」，并据此调整说话的距离。

  插件按人记录三件事：第一次见面是哪天、实际聊过几个不同的日子、一共说了多少条。
  聊的天数越多，熟悉度越高，她对这个人的态度就越放松——从客气，到会开玩笑，
  再到会主动找人说话、会说心事。

  四个档位：
  · 生人　——刚认识，礼貌有距离
  · 眼熟　——聊过几天，会吐槽、会记得上次说的事
  · 亲密　——聊了很久，会主动、会撒娇一点点、会留意状态
  · 主人　——**恒定最高档，永远不随天数变化**

  熟悉度会以一小段提示注入到她的上下文里，所以她知道对面是谁、熟到什么程度，
  不会对陌生人撒娇，也不会对老朋友见外。

  只管「亲近程度」，不管恋爱关系：再熟也不会越界。

  **可以和「大肥鱼的日记」联动**：亲密度插件负责判断谁够亲密，
  日记插件读这里的记录，把够亲密的人也写进日记。两个一起用，
  她的日记才不只是主人一个人的事。
help: |-
  【四个档位】

  生人　聊过 0 天
  眼熟　聊满「眼熟天数」（默认 3 天）
  亲密　聊满「亲密天数」（默认 14 天）
  主人　恒定最高，不受任何天数影响

  「天数」指实际聊过几个**不同的日子**，不是从认识那天起过了多少天。
  隔一天没聊就不算，所以是真·聊出来的。

  【和「大肥鱼的日记」联动】

  两个插件是上下游关系：

  亲密度（本插件）→ 判断谁够亲密 → 写进 users.json
                                    ↓
                    日记插件读取这个文件 → 够亲密的人也能进日记

  联动效果：
  · 只装亲密度：她说话会分亲疏，但日记里只有主人
  · 只装日记：只记主人
  · 两个都装：日记里会出现「小晴」这样的亲密朋友，称呼不会串

  注意两边的门槛要一致——日记插件的 intimate_days 要和本插件的
  close_days 填同一个数（默认都是 14），否则会出现「这边说亲密、那边说不够」。

  【怎么影响她】

  注入一段短提示，例如：

    【熟悉度】你正在和「小晴」聊天（不是主人）。
    认识 12 天，实际聊过 8 天，共 214 条。当前熟悉度：亲密。
    按人设「关系与距离」那节调整距离，别越界，也别叫主人。

  对主人则只有一句：

    【熟悉度】对方是主人。亲密度：最高（永远，不随天数变化）。

  【指令】

  /亲密度 —— 主人发：列出所有人（昵称 / 档位 / 聊过几天 / 共几条 / 还差几天升级）
              其他人发：只看自己那条
  /好感度 —— 老指令，保留兼容，等同 /亲密度

  【配置】

  面板 → 插件 → 大肥鱼的亲密度 → 配置
  · owner_ids　主人 QQ，亲密度恒定最高
  · familiar_days / close_days　两个升级门槛
  · scope　统计范围，默认只统计私聊
  · inject_enabled　是否注入上下文
  · show_count　注入时是否带条数
  【想查熟悉度？直接问，不用指令】

  · 「我和谁最熟」→ 列出排名
  · 「至诚到哪一档了」→ 单独查那个人
  · 「还差几天升亲密」→ 告诉你差距
  · /亲密度 仍然可用，效果一样

  【版本历史】
  1.5.0　熟悉度可以直接问，不用指令（问谁最熟 / 某人到哪档 / 还差几天）
  1.4.2　配置界面把两个 QQ 号提到最前面并编号；新增《使用教程.md》
  1.4.1　指令合并：只用 /亲密度 一个。主人发看总表，其他人发只看自己；/好感度 保留兼容
  1.4.0　新增主人查询：/好感度 或 /亲密度 列表，看所有人的天数、档位和还差几天升级；
        昵称改为向协议端查询，不再把 QQ 号当名字
  1.3.0　修复：群聊不算亲密度（scope 新增 all，默认私聊+群聊都算）；名字显示成 QQ 号
  1.2.0　新增「大肥鱼的 QQ（bot_ids）」配置项：不把机器人自己算成聊天对象
  1.1.0　介绍页补「和日记插件联动」说明 + 门槛对齐提醒
  1.0.0　首个版本：生人 / 眼熟 / 亲密 / 主人 四档，按聊天天数推进，
        每次请求注入熟悉度，/亲密度 查看进度
